name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/crypto.test.mjs web/linkify.test.mjs web/trust.test.mjs web/invite.test.mjs
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server
      - run: go run ./cmd/webhash
