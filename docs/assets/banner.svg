<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="nullchat. End-to-end encrypted, self-destructing chat for two.">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ccf88b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ccf88b" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#111514"/>

    <!-- ciphertext texture: what the server sees -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="url(#fade)">
      <text x="830" y="52">9f3a c71e 04bd e8a2 5c90</text>
      <text x="830" y="84">e1d0 2b8f a94c 6e13 f07a</text>
      <text x="830" y="116">4a7c 91e2 d03f b85a 1c6e</text>
      <text x="830" y="148">0b5e f2a7 6c19 8d43 e07b</text>
      <text x="830" y="180">d8f1 3a6c 07e9 b24d 5f8a</text>
      <text x="830" y="212">72cb 0e4f a5d8 1b93 e6c0</text>
      <text x="830" y="244">c40a 9e7d 13f6 5b2c d8a1</text>
      <text x="830" y="276">5e92 b1f0 4c8d e73a 0a6b</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="27.5" fill="none" stroke="#303730"/>
  </g>

  <!-- mark: the n_ from the app's favicon -->
  <g transform="translate(72 86)">
    <rect width="128" height="128" rx="30" fill="#191e1c" stroke="#303730" stroke-width="2"/>
    <path d="M30 94V42h16v9c12-17 42-13 42 12v31H72V64c0-13-26-13-26 4v26z" fill="#ccf88b"/>
    <rect x="92" y="98" width="22" height="7" rx="1.5" fill="#ccf88b">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- wordmark -->
  <text x="236" y="166" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="#e8ede3">nullchat<tspan fill="#ccf88b">.</tspan></text>
  <text x="240" y="212" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#939d91">End-to-end encrypted, self-destructing chat for two.</text>
</svg>
