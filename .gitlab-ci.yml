workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null'

stages:
  - test
  - deploy

go-checks:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_USER: nullchat
        POSTGRES_PASSWORD: nullchat
        POSTGRES_DB: nullchat
  variables:
    CGO_ENABLED: "1"
    DATABASE_URL: postgres://nullchat:nullchat@postgres:5432/nullchat?sslmode=disable
    TEST_DATABASE_URL: postgres://nullchat:nullchat@postgres:5432/nullchat_test?sslmode=disable
    IDEMPOTENCY_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  before_script:
    - apk add --no-cache build-base nodejs postgresql-client
    - go mod download
    - until pg_isready -h postgres -U nullchat -d nullchat; do sleep 1; done
    - PGPASSWORD=nullchat createdb -h postgres -U nullchat nullchat_test
  script:
    - go test -race ./...
    - go vet ./...
    - node --check web/app.js
    - node --test web/crypto.test.mjs web/linkify.test.mjs web/trust.test.mjs
    - go build -buildvcs=false ./cmd/server ./cmd/migrate
    - go run ./cmd/webhash
    - go test -tags=integration -race ./internal/storage/postgres

# Deploys every push to the default branch to the Render stand, only after
# go-checks passes. RENDER_DEPLOY_HOOK_KEY is the `key` part of the service's
# Deploy Hook URL; keep it as a protected, masked CI/CD variable. Render's own
# auto-deploy is off (render.yaml), so this job is the only deploy trigger.
deploy-staging:
  stage: deploy
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  needs: [go-checks]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # One deploy at a time; a newer push waits instead of racing an older one.
  resource_group: staging
  environment:
    name: staging
    url: https://nullchat-xdgz.onrender.com
  variables:
    RENDER_SERVICE_ID: srv-dase7k7lk1mc73bjd080
  script:
    - '[ -n "$RENDER_DEPLOY_HOOK_KEY" ] || { echo "RENDER_DEPLOY_HOOK_KEY is not set" >&2; exit 1; }'
    # ref pins the deploy to the commit that passed the checks, not the branch tip.
    - curl --fail-with-body -sS -X POST "https://api.render.com/deploy/${RENDER_SERVICE_ID}?key=${RENDER_DEPLOY_HOOK_KEY}&ref=${CI_COMMIT_SHA}"
